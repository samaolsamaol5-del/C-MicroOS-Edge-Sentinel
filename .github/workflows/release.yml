name: Build & Release C-MicroOS Edge Sentinel

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.output }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
            output: cmicro_os
          - os: windows-latest
            arch: windows-x64
            output: cmicro_os.exe
          - os: macos-latest
            arch: macos-universal
            output: cmicro_os

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Rename Artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/cmicro_os.exe ./${{ matrix.output }}
          else
            cp build/cmicro_os ./${{ matrix.output }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-MicroOS-${{ matrix.arch }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/C-MicroOS-linux-x64/cmicro_os
            artifacts/C-MicroOS-windows-x64/cmicro_os.exe
            artifacts/C-MicroOS-macos-universal/cmicro_os
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
