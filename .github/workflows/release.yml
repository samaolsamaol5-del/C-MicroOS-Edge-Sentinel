name: Build & Release C-MicroOS Edge Sentinel

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
            artifact_name: C-MicroOS-linux-x64
            bin_name: cmicro_os
          - os: windows-latest
            arch: windows-x64
            artifact_name: C-MicroOS-windows-x64
            bin_name: cmicro_os.exe
          - os: macos-latest
            arch: macos-universal
            artifact_name: C-MicroOS-macos-universal
            bin_name: cmicro_os

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Prepare Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/Release/${{ matrix.bin_name }} dist/
          elif [ -f "build/${{ matrix.bin_name }}" ]; then
            cp build/${{ matrix.bin_name }} dist/
          else
            cp build/Release/${{ matrix.bin_name }} dist/
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/C-MicroOS-linux-x64/cmicro_os
            artifacts/C-MicroOS-windows-x64/cmicro_os.exe
            artifacts/C-MicroOS-macos-universal/cmicro_os
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
