name: Build & Release C-MicroOS Edge Sentinel

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            bin_name: cmicro_os
          - os: windows-latest
            target: windows-x64
            bin_name: cmicro_os.exe
          - os: macos-latest
            target: macos-universal
            bin_name: cmicro_os

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Binary
        run: cmake --build build --config Release

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "build/Release/${{ matrix.bin_name }}" ]; then
            cp "build/Release/${{ matrix.bin_name }}" "dist/C-MicroOS-${{ matrix.target }}.exe"
          else
            cp "build/${{ matrix.bin_name }}" "dist/C-MicroOS-${{ matrix.target }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-MicroOS-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
