name: Build & Release C-MicroOS Edge Sentinel

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x64
          - os: windows-latest
            arch: windows-x64
          - os: macos-latest
            arch: macos-universal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Find Binary
        id: find_binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "bin_path=build/Release/cmicro_os.exe" >> $GITHUB_OUTPUT
          elif [ -f "build/cmicro_os" ]; then
            echo "bin_path=build/cmicro_os" >> $GITHUB_OUTPUT
          else
            echo "bin_path=build/Release/cmicro_os" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-MicroOS-${{ matrix.arch }}
          path: ${{ steps.find_binary.outputs.bin_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/C-MicroOS-linux-x64/*
            artifacts/C-MicroOS-windows-x64/*
            artifacts/C-MicroOS-macos-universal/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
